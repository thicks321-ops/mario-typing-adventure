<style>

#levels button.lock{background:#999;cursor:default}#levels button.sel{outline:6px solid #ffd800}
.hidden{display:none!important}
@media (max-height:500px){#overlay h1{font-size:30px;margin:0}#levels{grid-template-columns:repeat(6,1fr);width:96vw;gap:6px}#levels button{font-size:14px;padding:6px}.grade{padding:4px 12px;margin:2px}#gr{margin:6px 0 2px}}
.grade{background:#0008;border-radius:20px;padding:10px 18px;margin:4px 0 8px;text-shadow:none;width:min(94vw,640px)}
.glabel{font-size:min(5vw,22px);color:#ffd800}

#gr::-webkit-slider-thumb{-webkit-appearance:none;width:48px;height:48px;border-radius:50%;background:#e52521;border:5px solid #fff;box-shadow:0 2px 6px #0008;cursor:pointer}
#gr::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:#e52521;border:5px solid #fff;cursor:pointer}
.ticks{display:flex;justify-content:space-between;font-size:min(3.4vw,18px)}.tick{cursor:pointer;padding:2px 4px;border-radius:8px}.tick.on{background:#ffd800;color:#222}

#hud{pointer-events:auto;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#ti{position:absolute;left:-9999px;top:0;opacity:0;width:1px;height:1px}
@media (pointer:coarse){#kb{gap:5px}#kb div{gap:max(2px,0.9vw)}#kb b{width:min(8.4vw,9.5vh,60px);height:min(11vw,10vh,64px);font-size:min(6vw,5.5vh,30px);opacity:.92}
#word{font-size:min(14vw,11vh,100px);padding:0 18px;border-width:4px}#sentence{font-size:min(5.5vw,5vh,34px);padding:4px 12px}
#levels{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));width:min(94vw,700px)}#levels button{font-size:min(5vw,20px);padding:10px}
#overlay h1{font-size:min(10vw,9vh,80px)}#overlay .tip{font-size:min(4vw,16px);margin:12px}#top button{font-size:18px;padding:4px 10px}}
@media (pointer:coarse) and (orientation:landscape){#hud{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:8px;padding-top:0}#sentence{width:100%;margin:0;text-align:center}#kb{margin:0}#word{font-size:min(9vw,14vh)}#kb b{height:min(9vh,48px);width:min(5.4vw,9vh,52px);font-size:min(4vh,22px)}}

 {name:"Final Showdown",theme:"castle",s:[["Inside the fortress Bowser was waiting impatiently","run"],["The enormous turtle king stomped his feet","duck"],["Mario launched fireballs with perfect aim","fire"],["He leaped over obstacles without stopping","hop"],["Bowser grumbled and retreated far away","bowser"],["Princess Peach thanked Mario for his courage","peach"],["Everyone celebrated with fireworks and laughter","peach"]]}]}];
var tier=0;const ST=()=>TIERS[tier].m;
const HINT={mario:"🧢",peach:"👸",bowser:"🐢"};
const THEMES={hills:{sky:["#6ec6ff","#bdeaff"],hill:"#3fae49",hill2:"#7cd36f",ground:"#c8743a",top:"#4cc04a"},
pipes:{sky:["#5ab4ff","#cdf"],hill:"#2f9a3f",hill2:"#6fc96a",ground:"#b5652f",top:"#3db042"},
water:{sky:["#7fd0ff","#e0f6ff"],hill:"#4aa0c8",hill2:"#88c8e0",ground:"#c8743a",top:"#4cc04a"},
cave:{sky:["#2b2440","#4a3f66"],hill:"#3a3150",hill2:"#4c4266",ground:"#6a5a7a",top:"#8a7aa0"},

castle:{sky:["#5a4a8a","#c8a0d8"],hill:"#6a5a7a",hill2:"#8a7a9a",ground:"#777",top:"#999"},
sunset:{sky:["#ff8a6a","#ffe0a0"],hill:"#3a9a4a",hill2:"#e0a050",ground:"#b5652f",top:"#58b840"},
snow:{sky:["#9ad0ff","#f0f8ff"],hill:"#cfe6f5",hill2:"#e8f4ff",ground:"#8aa8c8",top:"#fff"},
desert:{sky:["#ffc860","#fff0c0"],hill:"#e0a050",hill2:"#f0c878",ground:"#d89a50",top:"#f0c070"},
night:{sky:["#0a1440","#2a3a7a"],hill:"#1a4a3a",hill2:"#24604a",ground:"#5a3a2a",top:"#2a8a4a"}};
const FAM={sunset:"hills",snow:"hills",desert:"hills",night:"hills"};
const STEP=110;
// ---------- state
const blank=()=>({v:2,tier:0,done:[0,1,2,3].map(()=>[0,0,0,0,0,0])});
let save=(()=>{let o;try{o=JSON.parse(localStorage.getItem("mta_save")||"null")}catch(e){}
 if(!o)return blank();if(o.v===2&&o.done)return o;const n=blank();if(o.stars)o.stars.forEach((x,i)=>{if(x>0)n.done[0][i]=1});return n})();
tier=save.tier||0;
const tierOpen=t=>t===0||save.done[t-1].every(Boolean),misOpen=(t,m)=>tierOpen(t)&&(m===0||!!save.done[t][m-1]);
function store(){localStorage.setItem("mta_save",JSON.stringify(save))}
var mode="start",lvl=0,si=0,wi=0,ci=0,words=[],muted=false,showKb=true,selIdx=0;
let props=[],wc=0;let mario={x:80,tx:80,y:0,vy:0,face:1,anim:0,act:null,actT:0},cam=0,parts=[],coins=[],t=0,ending=0,bowserX=0,bowserGone=0;
const cv=document.getElementById("game"),cx=cv.getContext("2d");let W,H,S,GY;
const TOUCH=matchMedia("(pointer:coarse)").matches||"ontouchstart" in window;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=Math.max(2,Math.round(Math.min(W,H)/(TOUCH?150:170)));setGY()}
function setGY(){const hh=(mode==="play"&&hud)?hud.offsetHeight:0;GY=Math.round(Math.max(16*S*2+60,Math.min(H*(H>W?0.75:0.55),H-hh-S*8)))}
addEventListener("resize",resize);resize();
// ---------- audio
let ac=null;function au(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
function tone(f,d,type="square",v=.08,dl=0){if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+dl;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.02)}
const sfx={blip:()=>tone(880,.07),boop:()=>tone(160,.15,"sine",.1),word:()=>[660,880,1320].forEach((f,i)=>tone(f,.1,"square",.07,i*.07)),
coin:()=>{tone(988,.08);tone(1319,.25,"square",.07,.08)},jump:()=>{if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.setValueAtTime(300,ac.currentTime);o.frequency.exponentialRampToValueAtTime(800,ac.currentTime+.15);g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.22)},
fan:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.18,"square",.07,i*.13))};

kbEl.innerHTML=ROWS.map(r=>"<div>"+[...r].map(k=>`<b id="k_${k}" class="f${FING[k]}${"fj".includes(k)?" home":""}">${k}</b>`).join("")+"</div>").join("");

function setTier(v){const msg=document.getElementById("gmsg"),gr=document.getElementById("gr");

function showSelect(){ov.style.justifyContent="";ov.style.paddingTop="";mode="select";hud.classList.add("hidden");ov.classList.remove("hidden");if(!tierOpen(tier))tier=0;if(!misOpen(tier,selIdx))selIdx=0;
 ov.innerHTML=`<h1>Pick a Mission</h1><div class="grade"><div class="glabel">Grade level</div><input id="gr" type="range" min="0" max="3" step="1" value="${tier}" aria-label="Grade level">
 <div class="ticks">${TIERS.map((T,i)=>`<span class="tick ${i===tier?"on":""}" data-t="${i}">${tierOpen(i)?"":"🔒 "}${T.name}</span>`).join("")}</div><div id="gmsg">${TIERS[tier].name} missions</div></div>

 const total=ST()[i].s.reduce((a,s)=>a+s[0].split(" ").length,0);bowserX=80+(total+3)*STEP;
 ov.classList.add("hidden");hud.classList.remove("hidden");loadSentence()}

function render(){setTimeout(setGY,0);sEl.innerHTML=words.map((w,i)=>`<span class="${i<wi?"done":i===wi?"cur":""}">${w}</span>`).join(" ");

function doAction(a){const m=mario;m.act=a;m.actT=0;m.ax=m.x;
 if(a==="hop"||a==="run"){m.vy=a==="hop"?-11:-7;m.tx+=a==="run"?STEP*.6:STEP*.3;sfx.jump()}

 if(a==="fire"){for(let i=0;i<3;i++)props.push({k:"f",x:m.x+12*S,y:-10*S,vx:7,vy:-2,t:-i*12})}

function flag(x){cx.fillStyle="#ddd";cx.fillRect(x,GY-S*60,S*1.5,S*60);cx.fillStyle="#2c2";const fy=mode==="done"?Math.min(GY-S*12,GY-S*58+ending*3):GY-S*58;cx.beginPath();cx.moveTo(x,fy);cx.lineTo(x-S*12,fy+S*5);cx.lineTo(x,fy+S*10);cx.fill();cx.fillStyle="#2c2";cx.beginPath();cx.arc(x+S,GY-S*61,S*2,0,7);cx.fill()}
function castle(x){const b=8*S;cx.fillStyle="#9a9a9a";cx.fillRect(x,GY-b*7,b*8,b*7);for(let i=0;i<4;i++)cx.fillRect(x+i*b*2,GY-b*8,b,b);cx.fillStyle="#7a7a7a";cx.fillRect(x+b*2,GY-b*12,b*4,b*5);for(let i=0;i<2;i++)cx.fillRect(x+b*2+i*b*3,GY-b*13,b,b);cx.fillStyle="#222";cx.beginPath();cx.arc(x+b*4,GY-b*2.5,b*1.3,Math.PI,0);cx.fill();cx.fillRect(x+b*2.7,GY-b*2.5,b*2.6,b*2.5);cx.fillStyle="#ff7ac0";cx.fillRect(x+b*4,GY-b*16,S,b*3);cx.fillRect(x+b*4,GY-b*16,b*1.5,b)}
function fireworks(){if(t%18===0){const fx=W*(.15+Math.random()*.7),fy=H*(.1+Math.random()*.25),col=["#ff4f9a","#ffd800","#4fd0ff","#7aff6a"][t/18%4|0];for(let i=0;i<24;i++){const a=i/24*6.28;fw.push({x:fx,y:fy,vx:Math.cos(a)*4,vy:Math.sin(a)*4,l:50,col,ch:i%3?"●":"♥"})}if(!muted&&ac)tone(200+Math.random()*300,.2,"triangle",.05)}
 for(const f of fw){f.x+=f.vx;f.y+=f.vy;f.vy+=.08;f.l--;cx.globalAlpha=Math.max(0,f.l/50);cx.fillStyle=f.col;cx.font=`${S*4}px sans-serif`;cx.fillText(f.ch,f.x,f.y)}cx.globalAlpha=1;fw=fw.filter(f=>f.l>0)}
let fw=[];

 cx.fillStyle="#3fae49";cx.beginPath();cx.ellipse(W*.2,H*.85,W*.3,H*.25,0,Math.PI,0);cx.fill();cx.fillStyle="#c8743a";cx.fillRect(0,H*.85,W,H);cx.fillStyle="#4cc04a";cx.fillRect(0,H*.85,W,S*2);
 const hx=((t*2)%(W+200))-100;px((t>>3)%2?HERO2:HERO,HPAL,hx,H*.85-16*S,false);px(PEACH,PPAL,W*.82,H*.85-16*S,true)}
function loop(){t++;if(t%15===0)setGY();
 if(mode==="start"||mode==="select")titleBg();
 else{const m=mario;actUpdate();m.x+=(m.tx-m.x)*.08;if(!m.hold){m.vy+=.6;m.y+=m.vy;if(m.y>=0){m.y=0;m.vy=0}}
  if(mode==="done"){ending++;if(lvl<5&&ending>130&&ending%40===0&&ending<300)m.vy=-8}
  cam+=(m.x-cam)*.1;
  for(const c of coins){c.y+=c.vy;c.vy+=.5;c.life--}coins=coins.filter(c=>c.life>0);
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.15;q.life--}parts=parts.filter(q=>q.life>0);
  drawWorld();
  if(mode==="done"){if(lvl===5){fireworks();if(t%10===0)parts.push(p(mario.x+60,-30,"♥","#ff4f9a"))}else if(t%15===0)parts.push(p(mario.x,-40,"★","#ffd800"))}}
 requestAnimationFrame(loop)}
