<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mario Typing Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#222;font-family:"Comic Sans MS","Trebuchet MS",Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:fixed;width:100%;overscroll-behavior:none}
html,body{height:100dvh}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:8px 10px 12px;pointer-events:none}
#sentence{background:rgba(255,255,255,.93);border-radius:16px;padding:6px 18px;font-size:clamp(20px,3.4vw,40px);margin-bottom:6px;color:#333;box-shadow:0 3px 0 #0003}
#sentence span{margin:0 .2em;padding:0 .1em;border-radius:6px}#sentence .done{color:#1a9b2e}#sentence .cur{background:#ffe066;color:#000}
#word{background:#fff;border:5px solid #333;border-radius:20px;padding:4px 28px;font-size:clamp(48px,9vw,110px);font-weight:bold;letter-spacing:.08em;color:#333;min-width:3em;text-align:center}
#word .ok{color:#18a32c}#word .next{display:inline-block;text-decoration:underline;text-decoration-thickness:6px;color:#0050d8;animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#kb{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:4px}#kb div{display:flex;gap:4px}
#kb b{cursor:pointer;touch-action:none;width:clamp(26px,3.6vw,46px);height:clamp(26px,3.6vw,46px);display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:clamp(14px,2vw,22px);color:#222;border:2px solid #0004;opacity:.75}
#kb b.home{border-bottom:5px solid #333}#kb b.hi{opacity:1;transform:scale(1.25);outline:4px solid #fff;box-shadow:0 0 14px #ff0}
.f0{background:#ff9aa2}.f1{background:#ffdac1}.f2{background:#e2f0cb}.f3{background:#b5ead7}.f4{background:#c7ceea}
#top{position:absolute;top:8px;right:10px;display:flex;gap:8px}#top button{font:inherit;font-size:20px;padding:6px 12px;border-radius:12px;border:3px solid #333;background:#fff;cursor:pointer}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;text-shadow:3px 3px 0 #000}
#overlay h1{font-size:clamp(40px,7vw,90px);margin:0 0 10px;color:#ffd800}
#overlay .big{font-size:clamp(26px,4vw,48px);animation:bob .7s infinite alternate}
#overlay .tip{font-size:18px;margin-top:24px;max-width:700px;background:#0007;padding:8px 14px;border-radius:10px;text-shadow:none}
#levels{display:grid;grid-template-columns:repeat(3,minmax(140px,220px));gap:16px;margin:10px}
#levels button{font:inherit;font-size:22px;padding:14px;border-radius:18px;border:4px solid #333;background:#fff;color:#333;cursor:pointer;text-shadow:none}
#levels button.lock{background:#999;cursor:default}#levels button.sel{outline:6px solid #ffd800}
.hidden{display:none!important}
#hud{pointer-events:auto;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#ti{position:absolute;left:-9999px;top:0;opacity:0;width:1px;height:1px}
@media (pointer:coarse){#kb{gap:5px}#kb div{gap:max(2px,0.9vw)}#kb b{width:min(8.4vw,9.5vh,60px);height:min(11vw,10vh,64px);font-size:min(6vw,5.5vh,30px);opacity:.92}
#word{font-size:min(14vw,11vh,100px);padding:0 18px;border-width:4px}#sentence{font-size:min(5.5vw,5vh,34px);padding:4px 12px}
#levels{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));width:min(94vw,700px)}#levels button{font-size:min(5vw,20px);padding:10px}
#overlay h1{font-size:min(10vw,9vh,80px)}#overlay .tip{font-size:min(4vw,16px);margin:12px}#top button{font-size:18px;padding:4px 10px}}
@media (pointer:coarse) and (orientation:landscape){#hud{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:8px;padding-top:0}#sentence{width:100%;margin:0;text-align:center}#kb{margin:0}#word{font-size:min(9vw,14vh)}#kb b{height:min(9vh,48px);width:min(5.4vw,9vh,52px);font-size:min(4vh,22px)}}
</style></head><body>
<canvas id="game"></canvas>
<div id="top"><button id="kbBtn" title="Keyboard">⌨️</button><button id="muteBtn" title="Sound">🔊</button><button id="menuBtn" title="Levels">🏠</button></div>
<div id="hud" class="hidden"><div id="sentence"></div><div id="word"></div><div id="kb"></div></div>
<div id="overlay"></div><input id="ti" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<script>
"use strict";
const STORIES=[
 {name:"Off We Go",theme:"hills",s:[["Mario is up","wave"],["He has a red hat","hat"],["The sun is hot","run"],["Mario can run","run"],["Run Mario run","run"],["He can hop","hop"]]},
 {name:"Pipe Hop",theme:"pipes",s:[["I see a big pipe","run"],["Hop on the pipe","hop"],["It is green","run"],["Mario can jump","hop"],["Up and up he goes","hop"],["He gets a coin","coin"],["Yay Mario","wave"]]},
 {name:"The Big Bridge",theme:"water",s:[["Here is the sea","run"],["The fish say hi","fish"],["Mario runs on the bridge","run"],["Do not fall","run"],["Jump the gap","hop"],["He made it","wave"]]},
 {name:"Coin Cave",theme:"cave",s:[["It is dark in the cave","run"],["I see a gold coin","coin"],["Get the coin","coin"],["One more coin","coin"],["Mario has lots of coins","coin"],["Look a star","star"],["Mario jumps up","hop"]]},
 {name:"Lava Land",theme:"lava",s:[["The land is red and hot","run"],["Hop over the lava","hop"],["Mario is fast","run"],["Jump jump jump","hop"],["Look the castle","run"],["Peach is in there","wave"],["Keep going Mario","run"]]},
 {name:"Save Peach",theme:"castle",s:[["Mario is at the castle","run"],["Bowser is big and green","run"],["Bowser says stop","run"],["Mario jumps very high","hop"],["Bowser runs away","bowser"],["Peach is free","peach"],["Thank you Mario","peach"],["The end","peach"]]}
];
const THEMES={hills:{sky:["#6ec6ff","#bdeaff"],hill:"#3fae49",hill2:"#7cd36f",ground:"#c8743a",top:"#4cc04a"},
pipes:{sky:["#5ab4ff","#cdf"],hill:"#2f9a3f",hill2:"#6fc96a",ground:"#b5652f",top:"#3db042"},
water:{sky:["#7fd0ff","#e0f6ff"],hill:"#4aa0c8",hill2:"#88c8e0",ground:"#c8743a",top:"#4cc04a"},
cave:{sky:["#2b2440","#4a3f66"],hill:"#3a3150",hill2:"#4c4266",ground:"#6a5a7a",top:"#8a7aa0"},
lava:{sky:["#ff9a5a","#ffd29a"],hill:"#a0503a",hill2:"#c87050",ground:"#6a3a2a",top:"#9a4a30"},
castle:{sky:["#5a4a8a","#c8a0d8"],hill:"#6a5a7a",hill2:"#8a7a9a",ground:"#777",top:"#999"}};
const STEP=110;
// ---------- state
let save=JSON.parse(localStorage.getItem("mta_save")||"null")||{unlocked:1,stars:[0,0,0,0,0,0]};
function store(){localStorage.setItem("mta_save",JSON.stringify(save))}
var mode="start",lvl=0,si=0,wi=0,ci=0,words=[],muted=false,showKb=true,selIdx=0;
let mario={x:80,tx:80,y:0,vy:0,face:1,anim:0,act:null,actT:0},cam=0,parts=[],coins=[],t=0,ending=0,bowserX=0,bowserGone=0;
const cv=document.getElementById("game"),cx=cv.getContext("2d");let W,H,S,GY;
const TOUCH=matchMedia("(pointer:coarse)").matches||"ontouchstart" in window;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=Math.max(2,Math.round(Math.min(W,H)/(TOUCH?150:170)));setGY()}
function setGY(){const hh=(mode==="play"&&hud)?hud.offsetHeight:0;GY=Math.round(Math.max(16*S*1.6+40,Math.min(H*0.5,H-hh-4)))}
addEventListener("resize",resize);resize();
// ---------- audio
let ac=null;function au(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==="suspended")ac.resume()}
function tone(f,d,type="square",v=.08,dl=0){if(muted||!ac)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+dl;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.02)}
const sfx={blip:()=>tone(880,.07),boop:()=>tone(160,.15,"sine",.1),word:()=>[660,880,1320].forEach((f,i)=>tone(f,.1,"square",.07,i*.07)),
coin:()=>{tone(988,.08);tone(1319,.25,"square",.07,.08)},jump:()=>{if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.setValueAtTime(300,ac.currentTime);o.frequency.exponentialRampToValueAtTime(800,ac.currentTime+.15);g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.22)},
fan:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.18,"square",.07,i*.13))};
// ---------- UI
const ov=document.getElementById("overlay"),hud=document.getElementById("hud"),sEl=document.getElementById("sentence"),wEl=document.getElementById("word"),kbEl=document.getElementById("kb");
const ROWS=["qwertyuiop","asdfghjkl","zxcvbnm"],FING={q:0,a:0,z:0,w:1,s:1,x:1,e:2,d:2,c:2,r:3,f:3,v:3,t:3,g:3,b:3,y:4,h:4,n:4,u:4,j:4,m:4,i:2,k:2,o:1,l:1,p:0};
kbEl.innerHTML=ROWS.map(r=>"<div>"+[...r].map(k=>`<b id="k_${k}" class="f${FING[k]}${"fj".includes(k)?" home":""}">${k}</b>`).join("")+"</div>").join("");
function showStart(){ov.style.justifyContent="";ov.style.paddingTop="";mode="start";hud.classList.add("hidden");ov.classList.remove("hidden");
 ov.innerHTML=`<h1>Mario Typing Adventure</h1><div style="font-size:clamp(20px,3vw,32px)">Help Mario save Princess Peach!</div><p class="big"><span class="tk">Tap or press any key to start</span></p><div class="tip">👪 Parent tip: sit with your child, keep fingers on the home row (bumps on F and J). The glowing key on the keyboard shows what to press next. No timers, no wrong answers — just fun!</div>`}
function showSelect(){ov.style.justifyContent="";ov.style.paddingTop="";mode="select";hud.classList.add("hidden");ov.classList.remove("hidden");selIdx=Math.min(selIdx,save.unlocked-1);
 ov.innerHTML=`<h1>Pick a Story</h1><div id="levels">${STORIES.map((s,i)=>{const lock=i>=save.unlocked;return `<button data-i="${i}" class="${lock?"lock":""} ${i===selIdx?"sel":""}">${lock?"🔒":"⭐".repeat(save.stars[i])||"▶️"}<br>${i+1}. ${s.name}</button>`}).join("")}</div>
 <div style="font-size:22px">Tap a story (or arrow keys + Enter) &nbsp; <button id="reset" style="font:inherit;font-size:16px;border-radius:10px">Reset progress</button></div>`;
 ov.querySelectorAll("#levels button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i<save.unlocked)startLevel(i)});
 document.getElementById("reset").onclick=()=>{if(confirm("Reset all progress?")){save={unlocked:1,stars:[0,0,0,0,0,0]};store();selIdx=0;showSelect()}}}
function startLevel(i){lvl=i;si=0;wi=0;ci=0;mode="play";ending=0;bowserGone=0;parts=[];coins=[];
 mario={x:80,tx:80,y:0,vy:0,face:1,anim:0,act:null,actT:0};cam=0;
 const total=STORIES[i].s.reduce((a,s)=>a+s[0].split(" ").length,0);bowserX=80+(total+2)*STEP;
 ov.classList.add("hidden");hud.classList.remove("hidden");loadSentence()}
function loadSentence(){words=STORIES[lvl].s[si][0].split(" ");wi=0;ci=0;render()}
function render(){setTimeout(setGY,0);sEl.innerHTML=words.map((w,i)=>`<span class="${i<wi?"done":i===wi?"cur":""}">${w}</span>`).join(" ");
 const w=words[wi]||"";wEl.innerHTML=[...w].map((c,i)=>i<ci?`<span class="ok">${c}</span>`:i===ci?`<span class="next">${c}</span>`:`<span>${c}</span>`).join("");
 kbEl.classList.toggle("hidden",!showKb);kbEl.querySelectorAll("b").forEach(b=>b.classList.remove("hi"));const n=(w[ci]||"").toLowerCase();const kb=document.getElementById("k_"+n);if(kb)kb.classList.add("hi")}
function shake(){wEl.classList.remove("shake");void wEl.offsetWidth;wEl.classList.add("shake")}
function doAction(a){mario.act=a;mario.actT=0;
 if(a==="hop"||a==="star"){mario.vy=-9;sfx.jump()} if(a==="star"){for(let i=0;i<14;i++)parts.push(p(mario.x,-40,"✦","#ff0"))}
 if(a==="coin"){coins.push({x:mario.x+10,y:-60,vy:-7,life:50});mario.vy=-6;sfx.coin()}
 if(a==="fish"){for(let i=0;i<3;i++)coins.push({x:mario.x+60+i*50,y:40,vy:-9-i,life:60,fish:1})}
 if(a==="bowser"){bowserGone=1}
 if(a==="peach"){for(let i=0;i<8;i++)parts.push(p(mario.x+40,-50,"♥","#ff4f9a"))}}
function p(x,y,ch,col){return{x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*6-2,life:60+Math.random()*30,ch,col}}
function key(e){au();const k=e.key;
 if(mode==="start"){showSelect();return}
 if(mode==="select"){if(k==="ArrowRight")selIdx=Math.min(save.unlocked-1,selIdx+1);else if(k==="ArrowLeft")selIdx=Math.max(0,selIdx-1);else if(k==="ArrowDown")selIdx=Math.min(save.unlocked-1,selIdx+3);else if(k==="ArrowUp")selIdx=Math.max(0,selIdx-3);else if(k==="Enter"||k===" "){startLevel(selIdx);return}else return;showSelect();return}
 if(mode==="done"){if(ending>90&&(k==="Enter"||k===" ")){if(lvl<5&&lvl+1<save.unlocked)startLevel(lvl+1);else showSelect()}return}
 if(mode!=="play"||k.length!==1||e.ctrlKey||e.metaKey)return;e.preventDefault();if(k===" ")return;
 const w=words[wi];if(k.toLowerCase()===w[ci].toLowerCase()){ci++;sfx.blip();mario.tx+=STEP/w.length*0.3;
  if(ci>=w.length){wi++;ci=0;sfx.word();mario.tx=Math.round((mario.tx-80)/STEP+0.7)*STEP+80;if(Math.random()<.4&&mario.y===0){mario.vy=-6}
   if(wi>=words.length){doAction(STORIES[lvl].s[si][1]);si++;if(si>=STORIES[lvl].s.length){finish();render();return}setTimeout(()=>{if(mode==="play")loadSentence()},500);words=[...words];render();wEl.innerHTML="⭐";return}}
  render()}else{sfx.boop();shake()}}
addEventListener("keydown",e=>{if(e.target.id==="ti")return;key(e)});
const fake=k=>({key:k,preventDefault(){}});
kbEl.addEventListener("pointerdown",e=>{const b=e.target.closest("b");if(!b)return;e.preventDefault();key(fake(b.textContent))});
ov.addEventListener("pointerup",e=>{if(e.target.closest("button"))return;if(mode==="start")key(fake("x"));else if(mode==="done")key(fake("Enter"))});
const ti=document.getElementById("ti");ti.addEventListener("input",()=>{for(const c of ti.value)key(fake(c));ti.value=""});
wEl.addEventListener("pointerdown",()=>{if(TOUCH&&!showKb)ti.focus()});
function finish(){mode="done";ending=0;save.stars[lvl]=3;if(save.unlocked<lvl+2)save.unlocked=Math.min(6,lvl+2);store();sfx.fan();mario.tx=bowserX-(lvl===5?60:0);if(lvl===5&&!bowserGone)bowserGone=1;
 setTimeout(()=>{if(mode!=="done")return;ov.classList.remove("hidden");ov.style.justifyContent="flex-start";ov.style.paddingTop="40px";hud.classList.add("hidden");
 ov.innerHTML=lvl===5?`<h1>You saved Peach! 💖</h1><div class="big">⭐⭐⭐ You are a typing hero! ⭐⭐⭐</div><div class="tip" style="font-size:22px">Tap or press Enter to play again</div>`:`<h1>Great job! ⭐⭐⭐</h1><div style="font-size:32px">Story ${lvl+1} done!</div><div class="tip" style="font-size:22px">Tap or press Enter for the next story</div>`},1500)}
document.getElementById("muteBtn").onclick=e=>{muted=!muted;e.target.textContent=muted?"🔇":"🔊";e.target.blur()};
document.getElementById("kbBtn").onclick=e=>{showKb=!showKb;render();if(TOUCH&&!showKb)ti.focus();else{ti.blur();e.target.blur()}};
document.getElementById("menuBtn").onclick=e=>{e.target.blur();showSelect()};
// ---------- drawing
function px(map,pal,x,y,flip){const s=S;for(let r=0;r<map.length;r++)for(let c=0;c<map[r].length;c++){const ch=map[r][c];if(ch==="."||!pal[ch])continue;cx.fillStyle=pal[ch];const cc=flip?map[r].length-1-c:c;cx.fillRect(Math.round(x+cc*s),Math.round(y+r*s),s,s)}}
const HERO=["...RRRRR....","..RRRRRRRRR.","..HHHSSKS...",".HSHSSSKSSS.",".HSHHSSSKSSS","..HSSSSKKKK.","...SSSSSSS..","..RRBRRR....",".RRRBRRBRRR.","RRRRBBBBRRRR","SSRBYBBYBRSS","SSSBBBBBBSSS","SSBBBBBBBBSS","..BBB..BBB..",".HHH....HHH.","HHHH....HHHH"];
const HERO2=["...RRRRR....","..RRRRRRRRR.","..HHHSSKS...",".HSHSSSKSSS.",".HSHHSSSKSSS","..HSSSSKKKK.","...SSSSSSS..","..RRBRRRR...",".RRRRBBRRSS.","SRRRBBYBBSS.","SS.BBBBBBB..","...BBBBBBB..","..BBBB.BBB..","..HHH..BBB..","..HHHH.HHH..","........HHHH"];
const HPAL={R:"#e52521",H:"#6b3a12",S:"#ffc69a",K:"#2a1a0a",B:"#2a56d8",Y:"#ffd800"};
const PEACH=["....YYYY....","...YOYYOY...","..YYYYYYYY..","..YSSKSKSY..","..YSSSSSSY..","..YYSSSSYY..","...YPPPPY...","..PPPWWPPP..",".SPPPPPPPPS.",".S.PPPPPP.S.","...PPPPPPP..","..PPPPPPPP..","..PPWPPWPP..",".PPPPPPPPPP.",".PPPPPPPPPP.","PPPPPPPPPPPP"];
const PPAL={Y:"#ffd23a",O:"#40c0ff",S:"#ffd6b8",K:"#333",P:"#ff7ac0",W:"#fff"};
const BOWSER=["......OO.OO......","....RRRRRR.......","...GGGGGGGG......","..GGWKGGGGGG.....","..GGGGGGGGGGOO...","..YYYYGGGGGGGGO..","...YWYWGGGGGGGGO.","....YYY.GTGTGTGO.",".....GGGGTGTGTGT.","....YGGYYGGGGGGG.","...YYGYYYYGGGGG..","...YYYYYYYYGGG...","....YYYYYYYGG....","....GGG...GGG....","...WGGG...GGGW..."];
const BPAL={O:"#fff3c0",R:"#ff6a1a",G:"#3aa83a",W:"#fff",K:"#222",Y:"#ffe08a",T:"#fff"};
function grad(c1,c2){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function drawWorld(){const th=THEMES[STORIES[lvl].theme],T=STORIES[lvl].theme;
 cx.fillStyle=grad(th.sky[0],th.sky[1]);cx.fillRect(0,0,W,H);
 if(T!=="cave"&&T!=="castle"){cx.fillStyle=T==="lava"?"#fff2":"#fff";for(let i=0;i<8;i++){const x=((i*260-cam*.15)%(W+300)+W+300)%(W+300)-150,y=40+(i%3)*45;cloud(x,y)}}
 else{cx.fillStyle="#fff8";for(let i=0;i<30;i++){const x=((i*97-cam*.1)%W+W)%W;cx.fillRect(x,(i*53)%(GY*.7),S,S)}}
 for(const [sp,col,hh] of [[.3,th.hill2,.35],[.55,th.hill,.22]]){cx.fillStyle=col;for(let i=-1;i<W/180+2;i++){const off=-((cam*sp)%360);const x=off+i*360;cx.beginPath();cx.ellipse(x+180,GY,170,H*hh,0,Math.PI,0);cx.fill()}}
 // ground
 const ox=-cam+W*.3,tile=16*S/2;const start=Math.floor(cam-W*.3)/tile|0;
 for(let i=start-1;i<start+W/tile+2;i++){const x=ox+i*tile;const wx=i*tile;
  let gap=(T==="water"||T==="lava")&&wx>500&&((wx%1200)>800);
  if(gap){cx.fillStyle=T==="water"?"#2a8ae0":"#ff5a00";cx.fillRect(x,GY+tile*.4+Math.sin(t/10+i)*3,tile+1,H);
   if(T==="water"){cx.fillStyle="#8a5a2a";cx.fillRect(x,GY,tile+1,S*2);cx.fillRect(x+tile/2-S,GY,S*2,S*5)}else{cx.fillStyle="#ffd000";cx.fillRect(x+((t+i*7)%tile),GY+tile*.5,S*2,S*2)}continue}
  cx.fillStyle=th.ground;cx.fillRect(x,GY,tile+1,H);cx.fillStyle=th.top;cx.fillRect(x,GY,tile+1,S*2);cx.fillStyle="#0002";cx.fillRect(x,GY+tile,tile,S);cx.fillRect(x+tile-S,GY,S,H)}
 // props
 for(let i=1;i<60;i++){const wx=80+i*STEP*2.5;const x=ox+wx;if(x<-200||x>W+200)continue;
  if(T==="pipes"||(T==="hills"&&i%3===0))pipe(x+40,i%2?2:3);
  if(T==="cave"&&i%2){coin(x+30,GY-tile*3+Math.sin(t/8+i)*4)}
  if(T==="hills"||T==="cave"||T==="pipes"){if(i%3===1)bricks(x,GY-tile*4)}
  if(T==="castle"&&i%2){cx.fillStyle="#555";cx.fillRect(x,GY-tile*6,tile*1.2,tile*6);cx.fillStyle="#ff8a2a";cx.fillRect(x+tile*.4,GY-tile*4,tile*.4,tile*.6+Math.sin(t/5+i)*3)}
 }
 if(T==="castle"||T==="lava"){castle(ox+bowserX+(T==="lava"?STEP:STEP*2))}
 else flag(ox+bowserX+STEP*.5);
